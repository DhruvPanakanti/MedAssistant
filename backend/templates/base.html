<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Medical Assistant{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a class="brand" href="/"><span class="pulse-dot"></span>Medical Assistant</a>
    <div class="nav-links">
      <a href="/">Conditions</a>
      <a href="/chatbot">Symptom Chat</a>
      {% if logged_in %}
        <a href="/history">History</a>
        <a href="/logout">Logout</a>
      {% else %}
        <a href="/login">Admin login</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="page">
  <svg class="heartbeat" viewBox="0 0 400 28" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,14 L120,14 L136,2 L152,26 L168,14 L400,14"></path>
  </svg>
  {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
